<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111722" />
  <title>Bob: Ghost Hunter — Movement Lab v0.1</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0b0f16; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; touch-action:none; overscroll-behavior:none; }
    #shell {
      position:fixed; inset:0;
      padding-top:env(safe-area-inset-top);
      padding-right:env(safe-area-inset-right);
      padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
      box-sizing:border-box;
      display:flex; align-items:center; justify-content:center;
      background:#0b0f16;
    }
    #game { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    canvas { image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; }
    .overlay {
      position:fixed; inset:0; z-index:50; display:none;
      align-items:center; justify-content:center; text-align:center;
      background:#0b0f16; color:#f0f3f8;
      padding:32px; box-sizing:border-box;
      font-weight:800; letter-spacing:.08em;
    }
    .overlay .big { font-size:clamp(24px,7vw,48px); margin-bottom:16px; }
    .overlay .small { font-size:clamp(12px,3vw,18px); opacity:.78; line-height:1.5; }
    #resumeOverlay { cursor:pointer; }
  </style>
</head>
<body>
  <div id="shell"><div id="game"></div></div>
  <div id="rotateOverlay" class="overlay">
    <div>
      <div class="big">↻ ROTATE DEVICE</div>
      <div class="small">Bob's Movement Lab is built for landscape play.</div>
    </div>
  </div>
  <div id="resumeOverlay" class="overlay">
    <div>
      <div class="big">PAUSED</div>
      <div class="small">Tap anywhere to resume the Movement Lab.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
  (() => {
    'use strict';

    const W = 384;
    const H = 216;
    const WORLD_W = 3000;
    const WORLD_H = 700;

    const P = Object.freeze({
      NORMAL_MAX: 130,
      BOOTS_MAX: 182,
      GROUND_ACCEL: 900,
      GROUND_DECEL: 1150,
      REVERSE_ACCEL: 1250,
      AIR_ACCEL: 650,
      GRAVITY: 1200,
      JUMP_V: -420,
      SHORT_CUTOFF: -190,
      FALL_MAX: 500,
      COYOTE_MS: 110,
      BUFFER_MS: 120,
      BODY_W: 16,
      BODY_H: 28
    });

    const clamp = Phaser.Math.Clamp;
    const approach = (value, target, maxDelta) => {
      if (value < target) return Math.min(value + maxDelta, target);
      if (value > target) return Math.max(value - maxDelta, target);
      return target;
    };

    class LabScene extends Phaser.Scene {
      constructor() {
        super('MovementLab');
        this.controls = { left:false, right:false, jump:false, action:false };
        this.prevControls = { jump:false };
        this.coyote = 9999;
        this.jumpBuffer = 9999;
        this.lastFacing = 1;
        this.boots = false;
        this.debugVisible = true;
        this.trailVisible = false;
        this.cameraScrollYTarget = 0;
        this.lastSafe = { x:80, y:150 };
      }

      create() {
        this.physics.world.setBounds(0, 0, WORLD_W, WORLD_H);
        this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
        this.physics.world.gravity.y = P.GRAVITY;
        this.input.addPointer(3);

        this.makeTextures();
        this.drawBackground();

        this.solids = this.physics.add.staticGroup();
        this.oneWays = this.physics.add.staticGroup();
        this.labels = [];
        this.buildLab();

        this.player = this.physics.add.sprite(80, 150, 'bob_lab');
        this.player.setDepth(10);
        this.player.body.setSize(P.BODY_W, P.BODY_H);
        this.player.body.setOffset(4, 4);
        this.player.body.setMaxVelocity(P.BOOTS_MAX, P.FALL_MAX);
        this.player.setCollideWorldBounds(false);

        this.physics.add.collider(this.player, this.solids);
        this.physics.add.collider(
          this.player,
          this.oneWays,
          undefined,
          (player, platform) => {
            const b = player.body;
            if (b.velocity.y < 0) return false;
            const prevBottom = b.prev.y + b.height;
            const top = platform.body.y;
            return prevBottom <= top + 7;
          },
          this
        );

        this.keys = this.input.keyboard.addKeys({
          left: Phaser.Input.Keyboard.KeyCodes.LEFT,
          leftA: Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
          rightD: Phaser.Input.Keyboard.KeyCodes.D,
          jump: Phaser.Input.Keyboard.KeyCodes.SPACE,
          jumpZ: Phaser.Input.Keyboard.KeyCodes.Z,
          action: Phaser.Input.Keyboard.KeyCodes.X,
          reset: Phaser.Input.Keyboard.KeyCodes.R,
          boots: Phaser.Input.Keyboard.KeyCodes.B,
          debug: Phaser.Input.Keyboard.KeyCodes.F3,
          trail: Phaser.Input.Keyboard.KeyCodes.T
        });

        this.createTouchUI();
        this.createDebugUI();

        this.cameras.main.scrollX = 0;
        this.cameras.main.scrollY = 0;

        this.input.keyboard.on('keydown-R', () => this.resetPlayer());
        this.input.keyboard.on('keydown-B', () => this.toggleBoots());
        this.input.keyboard.on('keydown-F3', () => this.toggleDebug());
        this.input.keyboard.on('keydown-T', () => { this.trailVisible = !this.trailVisible; });

        this.time.addEvent({
          delay: 45,
          loop: true,
          callback: () => {
            if (!this.trailVisible || !this.player || !this.player.active) return;
            const dot = this.add.rectangle(this.player.x, this.player.y, 2, 2, 0x67c8ff, 0.65).setDepth(4);
            this.tweens.add({ targets:dot, alpha:0, duration:1600, onComplete:() => dot.destroy() });
          }
        });
      }

      makeTextures() {
        if (this.textures.exists('bob_lab')) return;
        const g = this.make.graphics({ x:0, y:0, add:false });
        // 24x32 deliberately crude placeholder Bob.
        g.fillStyle(0x2d394b, 1); g.fillRect(4, 14, 16, 15); // coat
        g.fillStyle(0x6f4a30, 1); g.fillRect(5, 0, 14, 6);   // hair
        g.fillStyle(0xd8ad7d, 1); g.fillRect(6, 5, 12, 10);  // face
        g.fillStyle(0x101820, 1); g.fillRect(8, 8, 2, 2); g.fillRect(14, 8, 2, 2); // eyes
        g.fillStyle(0x16202c, 1); g.fillRect(3, 14, 4, 12);  // backpack edge
        g.fillStyle(0x1a2230, 1); g.fillRect(5, 28, 5, 4); g.fillRect(14, 28, 5, 4); // boots
        g.generateTexture('bob_lab', 24, 32);
        g.destroy();
      }

      drawBackground() {
        this.cameras.main.setBackgroundColor('#151d29');
        const grid = this.add.graphics().setDepth(-20);
        grid.lineStyle(1, 0x243144, 0.35);
        for (let x = 0; x <= WORLD_W; x += 16) grid.lineBetween(x, 0, x, WORLD_H);
        for (let y = 0; y <= WORLD_H; y += 16) grid.lineBetween(0, y, WORLD_W, y);
        grid.lineStyle(1, 0x36506e, 0.35);
        for (let x = 0; x <= WORLD_W; x += 64) grid.lineBetween(x, 0, x, WORLD_H);
        for (let y = 0; y <= WORLD_H; y += 64) grid.lineBetween(0, y, WORLD_W, y);
      }

      addSolid(x, yTop, width, height=24, color=0x52657c) {
        const r = this.add.rectangle(x + width/2, yTop + height/2, width, height, color).setOrigin(0.5);
        this.physics.add.existing(r, true);
        this.solids.add(r);
        return r;
      }

      addOneWay(x, yTop, width, height=8) {
        const r = this.add.rectangle(x + width/2, yTop + height/2, width, height, 0x7397a8).setOrigin(0.5);
        this.physics.add.existing(r, true);
        this.oneWays.add(r);
        return r;
      }

      label(x, y, text, size=10, tint='#d6e2f0') {
        return this.add.text(x, y, text, { fontFamily:'monospace', fontSize:`${size}px`, color:tint, backgroundColor:'#101722aa', padding:{x:3,y:2} }).setDepth(2);
      }

      buildLab() {
        // A: Runway
        this.addSolid(0, 195, 470, 30);
        this.label(18, 142, 'A  RUNWAY — acceleration / stop / reverse');
        for (let x=64; x<450; x+=64) this.label(x, 181, `${x}px`, 7, '#7891ab');

        // B: Gap Series
        this.addSolid(500, 195, 100, 30);
        this.addSolid(648, 195, 100, 30); // 48 gap
        this.addSolid(812, 195, 100, 30); // 64 gap
        this.addSolid(992, 195, 110, 30); // 80 gap
        this.label(500, 142, 'B  GAP SERIES — running jump envelope');
        this.label(607, 181, '48', 8, '#ffd67b');
        this.label(765, 181, '64', 8, '#ffd67b');
        this.label(946, 181, '80', 8, '#ffd67b');

        // C: Steps
        this.addSolid(1130, 195, 100, 30);
        this.addSolid(1230, 170, 82, 55);
        this.addSolid(1312, 145, 82, 80);
        this.addSolid(1394, 120, 100, 105);
        this.label(1140, 98, 'C  PLATFORM STEPS — short hops / landing');

        // D: Low ceiling
        this.addSolid(1510, 195, 250, 30);
        this.addSolid(1540, 120, 190, 12, 0x435164);
        this.label(1518, 142, 'D  LOW CEILING — quick tap vs held jump');

        // E: One-way tower
        this.addSolid(1780, 195, 330, 30);
        this.addOneWay(1815, 158, 86);
        this.addOneWay(1910, 124, 86);
        this.addOneWay(1815, 90, 86);
        this.addOneWay(1910, 56, 110);
        this.label(1790, 24, 'E  ONE-WAY TOWER — vertical camera / buffering');

        // F: Coyote strip
        this.addSolid(2130, 195, 90, 30);
        this.addSolid(2240, 195, 90, 30);
        this.label(2128, 145, 'F  LEDGE STRIP — test late jump / coyote');
        this.label(2222, 182, '20px', 8, '#ffd67b');

        // G: Long-fall shaft and recovery stairs
        this.addSolid(2340, 120, 160, 18);
        this.addSolid(2340, 640, 330, 30);
        this.addSolid(2580, 570, 90, 14);
        this.addSolid(2500, 500, 90, 14);
        this.addSolid(2580, 430, 90, 14);
        this.addSolid(2500, 360, 90, 14);
        this.addSolid(2580, 290, 90, 14);
        this.addSolid(2500, 220, 90, 14);
        this.addSolid(2580, 150, 90, 14);
        this.label(2346, 87, 'G  LONG FALL — terminal velocity / camera');

        // H: Touch arena at lower level
        this.addSolid(2700, 640, 290, 30);
        this.addSolid(2740, 590, 80, 12);
        this.addSolid(2860, 550, 80, 12);
        this.label(2710, 606, 'H  TOUCH ARENA — move / jump without looking down');

        // Visual pit warning under normal-level gaps.
        const hazard = this.add.graphics().setDepth(-2);
        hazard.fillStyle(0x3a1f2f, 0.55);
        hazard.fillRect(470, 225, 1660, 70);
        hazard.fillRect(2220, 225, 110, 70);
      }

      createTouchUI() {
        this.touchRects = {
          left:   new Phaser.Geom.Rectangle(14, 152, 56, 52),
          right:  new Phaser.Geom.Rectangle(72, 152, 56, 52),
          action: new Phaser.Geom.Rectangle(252, 157, 54, 50),
          jump:   new Phaser.Geom.Rectangle(309, 145, 65, 62)
        };

        const makeBtn = (rect, label, alpha=0.38) => {
          const r = this.add.rectangle(rect.x + rect.width/2, rect.y + rect.height/2, rect.width, rect.height, 0xe6eef8, alpha)
            .setScrollFactor(0).setDepth(1000).setStrokeStyle(1, 0xffffff, 0.42);
          const t = this.add.text(rect.x + rect.width/2, rect.y + rect.height/2, label, {
            fontFamily:'monospace', fontSize:'13px', color:'#101722', fontStyle:'bold'
          }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);
          return { r, t, alpha };
        };
        this.touchVisuals = {
          left: makeBtn(this.touchRects.left, '◀'),
          right: makeBtn(this.touchRects.right, '▶'),
          action: makeBtn(this.touchRects.action, 'A', 0.26),
          jump: makeBtn(this.touchRects.jump, 'JUMP', 0.42)
        };

        this.bootsButton = this.add.text(191, 8, 'BOOTS: OFF', {
          fontFamily:'monospace', fontSize:'9px', color:'#d9e7f5', backgroundColor:'#192436cc', padding:{x:5,y:3}
        }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(1002).setInteractive({ useHandCursor:true });
        this.bootsButton.on('pointerdown', () => this.toggleBoots());

        this.resetButton = this.add.text(376, 8, 'RESET', {
          fontFamily:'monospace', fontSize:'9px', color:'#d9e7f5', backgroundColor:'#192436cc', padding:{x:5,y:3}
        }).setOrigin(1, 0).setScrollFactor(0).setDepth(1002).setInteractive({ useHandCursor:true });
        this.resetButton.on('pointerdown', () => this.resetPlayer());
      }

      createDebugUI() {
        this.titleUI = this.add.text(8, 7, 'BOB MOVEMENT LAB v0.1', {
          fontFamily:'monospace', fontSize:'9px', color:'#e7edf5', backgroundColor:'#101722bb', padding:{x:4,y:3}
        }).setScrollFactor(0).setDepth(1002);

        this.debugText = this.add.text(8, 29, '', {
          fontFamily:'monospace', fontSize:'8px', color:'#d6e2f0', backgroundColor:'#0d131dcc', padding:{x:4,y:3}, lineSpacing:1
        }).setScrollFactor(0).setDepth(1002);

        this.helpText = this.add.text(376, 30, 'Keyboard: ← → / A D   Space/Z jump\nR reset   B boots   F3 debug   T trail', {
          fontFamily:'monospace', fontSize:'7px', color:'#93a8bd', backgroundColor:'#0d131d99', padding:{x:3,y:2}, align:'right'
        }).setOrigin(1,0).setScrollFactor(0).setDepth(1002);
      }

      toggleBoots() {
        this.boots = !this.boots;
        if (this.bootsButton) {
          this.bootsButton.setText(this.boots ? 'BOOTS: ON' : 'BOOTS: OFF');
          this.bootsButton.setColor(this.boots ? '#fff1a8' : '#d9e7f5');
        }
      }

      toggleDebug() {
        this.debugVisible = !this.debugVisible;
        this.debugText.setVisible(this.debugVisible);
        this.helpText.setVisible(this.debugVisible);
      }

      resetPlayer() {
        this.player.setPosition(this.lastSafe.x, this.lastSafe.y);
        this.player.body.reset(this.lastSafe.x, this.lastSafe.y);
        this.player.setVelocity(0,0);
        this.coyote = 0;
        this.jumpBuffer = 9999;
      }

      readTouch() {
        const touch = { left:false, right:false, jump:false, action:false };
        const pointers = this.input.manager.pointers;
        for (let i=0; i<pointers.length; i++) {
          const p = pointers[i];
          if (!p || !p.isDown) continue;
          const x = p.x;
          const y = p.y;
          if (Phaser.Geom.Rectangle.Contains(this.touchRects.left, x, y)) touch.left = true;
          if (Phaser.Geom.Rectangle.Contains(this.touchRects.right, x, y)) touch.right = true;
          if (Phaser.Geom.Rectangle.Contains(this.touchRects.jump, x, y)) touch.jump = true;
          if (Phaser.Geom.Rectangle.Contains(this.touchRects.action, x, y)) touch.action = true;
        }
        return touch;
      }

      updateTouchVisuals() {
        for (const name of ['left','right','action','jump']) {
          const v = this.touchVisuals[name];
          const on = this.controls[name];
          v.r.setAlpha(on ? 0.72 : v.alpha);
          v.r.setScale(on ? 0.95 : 1);
          v.t.setScale(on ? 0.95 : 1);
        }
      }

      update(time, deltaMs) {
        if (!this.player || !this.player.body) return;
        const dt = Math.min(deltaMs, 33.34) / 1000;

        const touch = this.readTouch();
        const kbLeft = this.keys.left.isDown || this.keys.leftA.isDown;
        const kbRight = this.keys.right.isDown || this.keys.rightD.isDown;
        const kbJump = this.keys.jump.isDown || this.keys.jumpZ.isDown;
        const kbAction = this.keys.action.isDown;

        this.controls.left = kbLeft || touch.left;
        this.controls.right = kbRight || touch.right;
        this.controls.jump = kbJump || touch.jump;
        this.controls.action = kbAction || touch.action;

        let dir = 0;
        if (this.controls.left && !this.controls.right) dir = -1;
        else if (this.controls.right && !this.controls.left) dir = 1;
        else if (this.controls.left && this.controls.right) {
          // Prefer current facing if both are held; global finger slide will switch as soon as one leaves.
          dir = this.lastFacing;
        }
        if (dir !== 0) this.lastFacing = dir;

        const jumpPressed = this.controls.jump && !this.prevControls.jump;
        const jumpReleased = !this.controls.jump && this.prevControls.jump;
        this.prevControls.jump = this.controls.jump;

        const grounded = this.player.body.blocked.down || this.player.body.touching.down;
        if (grounded) {
          this.coyote = 0;
          if (Math.abs(this.player.body.velocity.y) < 2) this.player.body.velocity.y = 0;
        } else {
          this.coyote += deltaMs;
        }

        if (jumpPressed) this.jumpBuffer = 0;
        else this.jumpBuffer += deltaMs;

        const maxSpeed = this.boots ? P.BOOTS_MAX : P.NORMAL_MAX;
        const vx = this.player.body.velocity.x;
        let nextVx = vx;

        if (grounded) {
          if (dir === 0) {
            nextVx = approach(vx, 0, P.GROUND_DECEL * dt);
          } else {
            const target = dir * maxSpeed;
            const reversing = Math.sign(vx) !== 0 && Math.sign(vx) !== dir;
            const accel = reversing ? P.REVERSE_ACCEL : P.GROUND_ACCEL;
            nextVx = approach(vx, target, accel * dt);
          }
        } else if (dir !== 0) {
          nextVx = approach(vx, dir * maxSpeed, P.AIR_ACCEL * dt);
        }
        this.player.body.setVelocityX(clamp(nextVx, -maxSpeed, maxSpeed));

        if (this.jumpBuffer <= P.BUFFER_MS && this.coyote <= P.COYOTE_MS) {
          this.player.body.setVelocityY(P.JUMP_V);
          this.jumpBuffer = 9999;
          this.coyote = 9999;
        }

        if (jumpReleased && this.player.body.velocity.y < P.SHORT_CUTOFF) {
          this.player.body.setVelocityY(P.SHORT_CUTOFF);
        }
        if (this.player.body.velocity.y > P.FALL_MAX) this.player.body.setVelocityY(P.FALL_MAX);

        // Store reasonable ground reset positions, excluding tiny/one-way platforms and shaft.
        if (grounded && this.player.y < 240 && this.player.x < 2290) {
          this.lastSafe.x = this.player.x;
          this.lastSafe.y = this.player.y - 2;
        }
        if (grounded && this.player.x > 2670) {
          this.lastSafe.x = this.player.x;
          this.lastSafe.y = this.player.y - 2;
        }

        // Auto-rescue from lab pits. Long-fall shaft is intentionally allowed.
        const inFallShaft = this.player.x >= 2320 && this.player.x <= 2690;
        if (!inFallShaft && this.player.y > 285) this.resetPlayer();
        if (this.player.y > WORLD_H + 60) this.resetPlayer();

        this.updateCamera(dt);
        this.updateTouchVisuals();
        this.updateDebug(grounded, dir);
      }

      updateCamera(dt) {
        const cam = this.cameras.main;
        const screenXTarget = this.lastFacing > 0 ? 146 : 238;
        let targetX = this.player.x - screenXTarget;
        targetX = clamp(targetX, 0, WORLD_W - W);
        const kx = 1 - Math.exp(-8 * dt);
        cam.scrollX = Phaser.Math.Linear(cam.scrollX, targetX, kx);

        const playerScreenY = this.player.y - cam.scrollY;
        const topZone = 72;
        const bottomZone = 142;
        let targetY = cam.scrollY;
        if (playerScreenY < topZone) targetY = this.player.y - topZone;
        else if (playerScreenY > bottomZone) targetY = this.player.y - bottomZone;
        targetY = clamp(targetY, 0, WORLD_H - H);
        const ky = 1 - Math.exp(-6 * dt);
        cam.scrollY = Phaser.Math.Linear(cam.scrollY, targetY, ky);
      }

      updateDebug(grounded, dir) {
        if (!this.debugVisible) return;
        const b = this.player.body;
        const state = grounded ? (Math.abs(b.velocity.x) > 8 ? 'RUN' : 'IDLE') : (b.velocity.y < 0 ? 'JUMP' : 'FALL');
        const fps = Math.round(this.game.loop.actualFps || 0);
        const coyote = Math.min(Math.round(this.coyote), 9999);
        const buffer = Math.min(Math.round(this.jumpBuffer), 9999);
        this.debugText.setText(
          `FPS ${fps}   X ${this.player.x.toFixed(1)} Y ${this.player.y.toFixed(1)}\n` +
          `VX ${b.velocity.x.toFixed(1)} VY ${b.velocity.y.toFixed(1)}   ${state}\n` +
          `GROUND ${grounded ? 1:0}  COYOTE ${coyote}ms  BUFFER ${buffer}ms\n` +
          `INPUT L${this.controls.left?1:0} R${this.controls.right?1:0} J${this.controls.jump?1:0}   SPEED ${this.boots?'182':'130'}`
        );
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game',
      width: W,
      height: H,
      backgroundColor: '#151d29',
      render: {
        pixelArt: true,
        antialias: false,
        roundPixels: true,
        powerPreference: 'high-performance'
      },
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: W,
        height: H
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 0 },
          debug: false,
          fps: 60
        }
      },
      fps: {
        target: 60,
        forceSetTimeOut: false
      },
      scene: [LabScene]
    };

    const game = new Phaser.Game(config);
    const rotateOverlay = document.getElementById('rotateOverlay');
    const resumeOverlay = document.getElementById('resumeOverlay');
    let backgroundPaused = false;
    let sleeping = false;

    function setLoopSleeping(shouldSleep) {
      if (!game || !game.loop) return;
      if (shouldSleep && !sleeping) { game.loop.sleep(); sleeping = true; }
      else if (!shouldSleep && sleeping) { game.loop.wake(); sleeping = false; }
    }

    function updateOrientation() {
      const portrait = window.innerHeight > window.innerWidth;
      rotateOverlay.style.display = portrait ? 'flex' : 'none';
      if (portrait) {
        setLoopSleeping(true);
      } else if (!backgroundPaused) {
        setLoopSleeping(false);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        backgroundPaused = true;
        setLoopSleeping(true);
      } else if (window.innerWidth >= window.innerHeight) {
        resumeOverlay.style.display = 'flex';
      }
    });

    resumeOverlay.addEventListener('pointerdown', () => {
      backgroundPaused = false;
      resumeOverlay.style.display = 'none';
      updateOrientation();
    });

    window.addEventListener('resize', updateOrientation);
    window.addEventListener('orientationchange', () => setTimeout(updateOrientation, 120));
    updateOrientation();
  })();
  </script>
</body>
</html>
